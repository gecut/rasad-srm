services:
  migrate:
    image: ${MIGRATION_IMAGE:-ghcr.io/gecut/rasad-srm/migration}:${IMAGE_TAG:-latest}
    restart: 'no'
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-rasad_srm}}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-rasad-srm-production-payload-secret-key-32chars}
      SCHEMA_PUSH: ${SCHEMA_PUSH:-false}
      RUN_JOBS: 'false'
    networks:
      - dokploy-network

  cms:
    image: ${CMS_IMAGE:-ghcr.io/gecut/rasad-srm/cms}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-rasad_srm}}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-rasad-srm-production-payload-secret-key-32chars}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      PANEL_ORIGIN: ${PANEL_ORIGIN:-http://localhost:80}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      SCHEMA_PUSH: ${SCHEMA_PUSH:-false}
      RUN_JOBS: ${RUN_JOBS:-false}
      SMS_PROVIDER: ${SMS_PROVIDER:-unconfigured}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - dokploy-network
    labels:
      traefik.docker.network: dokploy-network
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/admin/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 8

  panel:
    image: ${PANEL_IMAGE:-ghcr.io/gecut/rasad-srm/panel}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      traefik.docker.network: dokploy-network
    expose:
      - '80'

networks:
  dokploy-network:
    external: true
