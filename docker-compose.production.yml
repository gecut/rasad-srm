services:
  cms:
    image: ${CMS_IMAGE:?Set CMS_IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET}
      SCHEMA_PUSH: 'false'
      RUN_JOBS: ${RUN_JOBS:-false}
      SMS_PROVIDER: ${SMS_PROVIDER:-unconfigured}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set HTTPS public origin}
    expose: ['3000']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/admin/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 6
  panel:
    image: ${PANEL_IMAGE:?Set PANEL_IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      cms: { condition: service_healthy }
    ports: ['8080:80']
